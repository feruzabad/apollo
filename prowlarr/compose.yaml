services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.6.5.5623-ls162
    container_name: prowlarr
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # s6 starts as root, chowns /config and runs Prowlarr as the abc user.
    # PUID/PGID are ignored: remapping abc needs a writable /etc/passwd.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /run:exec
      - /tmp
    pids_limit: 512
    environment:
      # AIOStreams reads the API over the apollo network with this key.
      PROWLARR__AUTH__APIKEY: "${PROWLARR__AUTH__APIKEY:?}"
      # Login on every request, even from the tailnet. Setting the method here
      # skips the UI's first-run user setup; create the user through the API
      # (see README).
      PROWLARR__AUTH__METHOD: Forms
      PROWLARR__AUTH__REQUIRED: Enabled
      PROWLARR__LOG__ANALYTICSENABLED: "False"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9696/ping"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # Tailscale-only web UI. No Caddy site: never public.
      - "${INTERFACE:?}:9696:9696"
    volumes:
      - data:/config
    networks:
      - apollo

volumes:
  data:

networks:
  apollo:
    external: true
