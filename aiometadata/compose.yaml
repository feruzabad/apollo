services:
  aiometadata:
    image: ghcr.io/cedya77/aiometadata:3.2.3
    container_name: aiometadata
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    environment:
      HOST_NAME: "${HOST_NAME}"
      DATABASE_URI: "sqlite://addon/data/db.sqlite"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?}@redis:6379"
      ADMIN_KEY: "${ADMIN_KEY}"
      ADDON_PASSWORD: "${ADDON_PASSWORD}"
      # Serves artwork from local disk at /poster-cache instead of re-fetching
      # it upstream. Kept out of data (the default) so up to
      # POSTER_CACHE_MAX_SIZE of re-downloadable images stays out of backups.
      ENABLE_BUILTIN_POSTER_CACHE: "true"
      POSTER_CACHE_DIR: /app/poster-cache
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - data:/app/addon/data
      - cache:/app/poster-cache
    networks:
      - apollo

volumes:
  data:
  cache:

networks:
  apollo:
    external: true
