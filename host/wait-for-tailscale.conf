# systemd drop-in for docker.service. Private ports are published only on
# the host's Tailscale IP, and a container whose address doesn't exist yet
# fails to start and stays down, so Docker waits for tailscale0 to get its
# IPv4 (up to 60s; after that it starts anyway, so public services never
# depend on Tailscale coming up).
#
# Install:
#   sudo install -Dm644 host/wait-for-tailscale.conf /etc/systemd/system/docker.service.d/wait-for-tailscale.conf
#   sudo systemctl daemon-reload

[Unit]
After=tailscaled.service
Wants=tailscaled.service

[Service]
ExecStartPre=/bin/sh -c 'for i in $$(seq 60); do ip -4 addr show dev tailscale0 2>/dev/null | grep -q "inet 100" && exit 0; sleep 1; done; exit 0'
