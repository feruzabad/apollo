services:
  aiostreams:
    image: ghcr.io/viren070/aiostreams:v2.35.5
    container_name: aiostreams
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    environment:
      BASE_URL: "${BASE_URL}"
      SECRET_KEY: "${SECRET_KEY}"
      DATABASE_URI: "sqlite://./data/db.sqlite"
      REDIS_URI: "redis://:${REDIS_PASSWORD:?}@redis:6379"
      AIOSTREAMS_AUTH: "${AIOSTREAMS_AUTH:?}"
      AIOSTREAMS_AUTH_REQUIRED: "true"
      # Built-in NZBHydra addon. Hydra proxies NZB downloads, so usenet
      # indexers never see AIOStreams. Hydra builds its NZB links from this
      # address, so whatever fetches the NZBs must be able to reach it.
      BUILTIN_NZBHYDRA_URL: "${BUILTIN_NZBHYDRA_URL:-http://nzbhydra2:5076}"
      BUILTIN_NZBHYDRA_API_KEY: "${BUILTIN_NZBHYDRA_API_KEY}"
      # Reuse a resolved usenet/debrid stream link for a day (default 1h), so
      # replaying or resuming a release doesn't grab its NZB from the indexer
      # again. Matches how long AltMount keeps processed releases (24h).
      BUILTIN_DEBRID_PLAYBACK_LINK_CACHE_TTL: "86400"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - data:/app/data
    networks:
      - apollo

volumes:
  data:

networks:
  apollo:
    external: true
