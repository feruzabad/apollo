services:
  aiostreams:
    image: ghcr.io/viren070/aiostreams:v2.35.0
    container_name: aiostreams
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    environment:
      BASE_URL: "${BASE_URL}"
      SECRET_KEY: "${SECRET_KEY}"
      DATABASE_URI: "sqlite://./data/db.sqlite"
      REDIS_URI: "redis://:${REDIS_PASSWORD:?}@redis:6379"
      AIOSTREAMS_AUTH: "${AIOSTREAMS_AUTH:?}"
      AIOSTREAMS_AUTH_REQUIRED: "true"
      # Built-in Prowlarr addon, over the apollo network.
      BUILTIN_PROWLARR_URL: "http://prowlarr:9696"
      BUILTIN_PROWLARR_API_KEY: "${BUILTIN_PROWLARR_API_KEY:?}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - data:/app/data
    networks:
      - apollo

volumes:
  data:

networks:
  apollo:
    external: true
