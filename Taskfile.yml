version: "3"

tasks:
  network:
    desc: Create the apollo docker networks if they don't exist
    silent: true
    cmds:
      - docker network inspect apollo >/dev/null 2>&1 || docker network create apollo
      # Dual-stack, Caddy only: published ports get kernel DNAT on IPv6 too,
      # instead of docker-proxy, which hides the real client address.
      - docker network inspect apollo_edge >/dev/null 2>&1 || docker network create --ipv6 apollo_edge

  up:portainer:
    desc: Start Portainer
    deps: [network]
    cmds:
      - docker compose --env-file portainer/.env -f portainer/compose.yaml up -d

  down:portainer:
    desc: Stop Portainer
    cmds:
      - docker compose --env-file portainer/.env -f portainer/compose.yaml down

  up:aiometadata:
    desc: Start AIOMetadata
    deps: [network, up:redis]
    cmds:
      - docker compose --env-file aiometadata/.env -f aiometadata/compose.yaml up -d

  down:aiometadata:
    desc: Stop AIOMetadata
    cmds:
      - docker compose --env-file aiometadata/.env -f aiometadata/compose.yaml down

  up:aiostreams:
    desc: Start AIOStreams
    deps: [network, up:redis]
    cmds:
      - docker compose --env-file aiostreams/.env -f aiostreams/compose.yaml up -d

  down:aiostreams:
    desc: Stop AIOStreams
    cmds:
      - docker compose --env-file aiostreams/.env -f aiostreams/compose.yaml down

  up:aiomanager:
    desc: Start AIOManager
    deps: [network]
    cmds:
      - docker compose --env-file aiomanager/.env -f aiomanager/compose.yaml up -d

  down:aiomanager:
    desc: Stop AIOManager
    cmds:
      - docker compose --env-file aiomanager/.env -f aiomanager/compose.yaml down

  up:prowlarr:
    desc: Start Prowlarr
    deps: [network]
    cmds:
      - docker compose --env-file prowlarr/.env -f prowlarr/compose.yaml up -d

  down:prowlarr:
    desc: Stop Prowlarr
    cmds:
      - docker compose --env-file prowlarr/.env -f prowlarr/compose.yaml down

  up:redis:
    desc: Start Redis
    run: once
    deps: [network]
    cmds:
      - docker compose --env-file redis/.env -f redis/compose.yaml up -d

  down:redis:
    desc: Stop Redis
    cmds:
      - docker compose --env-file redis/.env -f redis/compose.yaml down

  up:caddy:
    desc: Start Caddy
    deps: [network]
    cmds:
      - docker compose --env-file caddy/.env -f caddy/compose.yaml up -d

  down:caddy:
    desc: Stop Caddy
    cmds:
      - docker compose --env-file caddy/.env -f caddy/compose.yaml down

  up:backup:
    desc: Start backups (restic, dedicated container per job)
    deps: [network]
    cmds:
      - docker compose --env-file backup/.env -f backup/compose.yaml up -d

  down:backup:
    desc: Stop backups
    cmds:
      - docker compose --env-file backup/.env -f backup/compose.yaml down

  up:
    desc: Start all services
    cmds:
      - task: up:portainer
      - task: up:redis
      - task: up:prowlarr
      - task: up:aiometadata
      - task: up:aiostreams
      - task: up:aiomanager
      - task: up:caddy
      - task: up:backup

  down:
    desc: Stop all services
    cmds:
      - task: down:backup
      - task: down:caddy
      - task: down:aiomanager
      - task: down:aiostreams
      - task: down:aiometadata
      - task: down:prowlarr
      - task: down:redis
      - task: down:portainer
