services:
  backup:
    image: mazzolino/restic:1.8.2
    container_name: backup
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Stable hostname: restic groups snapshots by host, and the default
    # (container ID) changes on every recreate, orphaning old snapshots from
    # the retention policy.
    hostname: apollo
    # Read-only access to volume files owned by other UIDs (e.g. .env).
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
    pids_limit: 256
    environment:
      RUN_ON_STARTUP: "true"
      BACKUP_CRON: "0 30 3 * * *"
      RESTIC_REPOSITORY: "${RESTIC_REPOSITORY:-/mnt/restic}"
      RESTIC_PASSWORD: "${RESTIC_PASSWORD:?}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      RESTIC_BACKUP_SOURCES: /mnt/volumes
      RESTIC_BACKUP_ARGS: "--tag apollo"
      # --keep-last: keep-daily keeps only a day's newest snapshot, so a
      # startup or manual backup would drop that day's earlier one (e.g. the
      # snapshot taken right before a deploy).
      RESTIC_FORGET_ARGS: "--group-by tags --keep-last 5 --keep-daily 7 --keep-weekly 4 --keep-monthly 6"
      TZ: UTC
    volumes:
      - portainer_data:/mnt/volumes/portainer:ro
      - caddy_data:/mnt/volumes/caddy:ro
      - aiostreams_data:/mnt/volumes/aiostreams:ro
      - aiometadata_data:/mnt/volumes/aiometadata:ro
      - aiomanager_data:/mnt/volumes/aiomanager:ro
      - prowlarr_data:/mnt/volumes/prowlarr:ro
      - nzbhydra2_data:/mnt/volumes/nzbhydra2:ro
      - ../portainer/.env:/mnt/volumes/env/portainer/.env:ro
      - ../caddy/.env:/mnt/volumes/env/caddy/.env:ro
      - ../redis/.env:/mnt/volumes/env/redis/.env:ro
      - ../aiostreams/.env:/mnt/volumes/env/aiostreams/.env:ro
      - ../aiometadata/.env:/mnt/volumes/env/aiometadata/.env:ro
      - ../aiomanager/.env:/mnt/volumes/env/aiomanager/.env:ro
      - ../prowlarr/.env:/mnt/volumes/env/prowlarr/.env:ro
      - ../nzbhydra2/.env:/mnt/volumes/env/nzbhydra2/.env:ro
      - ../backup/.env:/mnt/volumes/env/backup/.env:ro
      - ./restic-repo:/mnt/restic
    networks:
      - apollo

  prune:
    image: mazzolino/restic:1.8.2
    container_name: backup_prune
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    hostname: apollo
    cap_drop:
      - ALL
    pids_limit: 256
    environment:
      SKIP_INIT: "true"
      RUN_ON_STARTUP: "false"
      PRUNE_CRON: "0 0 4 * * 0"
      RESTIC_REPOSITORY: "${RESTIC_REPOSITORY:-/mnt/restic}"
      RESTIC_PASSWORD: "${RESTIC_PASSWORD:?}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      TZ: UTC
    volumes:
      - ./restic-repo:/mnt/restic
    networks:
      - apollo

  check:
    image: mazzolino/restic:1.8.2
    container_name: backup_check
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    hostname: apollo
    cap_drop:
      - ALL
    pids_limit: 256
    environment:
      SKIP_INIT: "true"
      RUN_ON_STARTUP: "false"
      CHECK_CRON: "0 15 5 * * 0"
      RESTIC_CHECK_ARGS: "--read-data-subset=10%"
      RESTIC_REPOSITORY: "${RESTIC_REPOSITORY:-/mnt/restic}"
      RESTIC_PASSWORD: "${RESTIC_PASSWORD:?}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      TZ: UTC
    volumes:
      - ./restic-repo:/mnt/restic
    networks:
      - apollo

volumes:
  portainer_data:
    external: true
  caddy_data:
    external: true
  aiostreams_data:
    external: true
  aiometadata_data:
    external: true
  aiomanager_data:
    external: true
  prowlarr_data:
    external: true
  nzbhydra2_data:
    external: true

networks:
  apollo:
    external: true
