services:
  redis:
    image: redis:8.10.2
    container_name: redis
    restart: unless-stopped
    # Capped so the cache can never starve the host. volatile-lfu evicts only
    # keys with a TTL (caches), least-used first, never keys meant to persist.
    # Lazy freeing and active defrag keep evictions and expiries off the main
    # thread and the footprint tight (AIOMetadata's REDIS_AUTOTUNE defaults,
    # set here since Redis is shared).
    command: >-
      redis-server --appendonly yes --save 3600 1
      --maxmemory 400mb --maxmemory-policy volatile-lfu
      --lazyfree-lazy-eviction yes --lazyfree-lazy-expire yes
      --lazyfree-lazy-server-del yes --activedefrag yes
      --requirepass ${PASSWORD:?}
    security_opt:
      - no-new-privileges:true
    # The entrypoint chowns /data and drops to the redis user via setpriv.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - SETPCAP
    read_only: true
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - data:/data
    networks:
      - apollo

volumes:
  data:

networks:
  apollo:
    external: true
