services:
  caddy:
    image: caddy:2.11.6
    container_name: caddy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /config
    pids_limit: 256
    environment:
      AIOSTREAMS_DOMAIN: "${AIOSTREAMS_DOMAIN:?}"
      AIOMETADATA_DOMAIN: "${AIOMETADATA_DOMAIN:?}"
      AIOMANAGER_DOMAIN: "${AIOMANAGER_DOMAIN:?}"
      TLS: "${TLS}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${HTTPS_PORT:?}:443"
      - "${HTTPS_PORT:?}:443/udp"
      - "${HTTP_PORT:?}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./robots.txt:/etc/caddy/static/robots.txt:ro
      - data:/data
    networks:
      apollo: {}
      # IPv6-enabled; carries the published ports and Caddy's default route.
      # The apps stay IPv4-only on apollo, so their outbound traffic is unchanged.
      apollo_edge:
        gw_priority: 1

volumes:
  data:

networks:
  apollo:
    external: true
  apollo_edge:
    external: true
